<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Book Tracker – Organize your reading journey. Track books you want to read, are currently reading, or have finished." />
  <title>Book Tracker – Organize Your Reading Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">📚</span>
        <div>
          <h1 class="header-title">Book Tracker</h1>
          <p class="header-subtitle">Organize your reading journey</p>
        </div>
      </div>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">

    <!-- STATISTICS SECTION -->
    <section class="stats-section" aria-label="Reading statistics">
      <div class="stats-grid">
        <div class="stat-card stat-toread">
          <div class="stat-icon" aria-hidden="true">📖</div>
          <div class="stat-body">
            <span class="stat-count" id="stat-toread">0</span>
            <span class="stat-label">To Read</span>
          </div>
        </div>
        <div class="stat-card stat-reading">
          <div class="stat-icon" aria-hidden="true">🔖</div>
          <div class="stat-body">
            <span class="stat-count" id="stat-reading">0</span>
            <span class="stat-label">Reading</span>
          </div>
        </div>
        <div class="stat-card stat-finished">
          <div class="stat-icon" aria-hidden="true">✅</div>
          <div class="stat-body">
            <span class="stat-count" id="stat-finished">0</span>
            <span class="stat-label">Finished</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ADD BOOK FORM -->
    <section class="form-section" aria-label="Add a new book">
      <div class="card form-card">
        <h2 class="section-title">
          <span aria-hidden="true">➕</span> Add a New Book
        </h2>
        <form id="add-book-form" novalidate>
          <div class="form-row">

            <!-- Title Field -->
            <div class="form-group">
              <label for="book-title" class="form-label">Book Title <span class="required" aria-hidden="true">*</span></label>
              <input
                type="text"
                id="book-title"
                name="book-title"
                class="form-input"
                placeholder="e.g. The Great Gatsby"
                autocomplete="off"
                aria-required="true"
                aria-describedby="title-error"
              />
              <span class="field-error" id="title-error" role="alert" aria-live="polite"></span>
            </div>

            <!-- Author Field -->
            <div class="form-group">
              <label for="book-author" class="form-label">Author <span class="required" aria-hidden="true">*</span></label>
              <input
                type="text"
                id="book-author"
                name="book-author"
                class="form-input"
                placeholder="e.g. F. Scott Fitzgerald"
                autocomplete="off"
                aria-required="true"
                aria-describedby="author-error"
              />
              <span class="field-error" id="author-error" role="alert" aria-live="polite"></span>
            </div>

            <!-- Status Field -->
            <div class="form-group form-group--status">
              <label for="book-status" class="form-label">Reading Status</label>
              <select id="book-status" name="book-status" class="form-select" aria-label="Select reading status">
                <option value="To read">📖 To Read</option>
                <option value="Reading">🔖 Reading</option>
                <option value="Finished">✅ Finished</option>
              </select>
            </div>

          </div>

          <div class="form-actions">
            <button type="submit" id="add-book-btn" class="btn btn-primary">
              <span aria-hidden="true">＋</span> Add Book
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- SEARCH & BOOK LIST -->
    <section class="library-section" aria-label="Your book library">
      <div class="library-header">
        <h2 class="section-title">
          <span aria-hidden="true">🗂️</span> My Library
        </h2>
        <!-- Search Bar -->
        <div class="search-wrapper">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search by title or author…"
            aria-label="Search books by title or author"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Book Cards Grid -->
      <div id="book-list" class="book-grid" aria-live="polite" aria-label="Book list">
        <!-- Cards rendered by JS -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📭</div>
        <p class="empty-title">No books found</p>
        <p class="empty-sub" id="empty-sub-text">Add your first book using the form above!</p>
      </div>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p>📚 Book Tracker &mdash; Built with ❤️ and Vanilla JS &bull; Data stored in your browser</p>
  </footer>

  <!-- ========== DELETE CONFIRMATION MODAL ========== -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <div class="modal-icon" aria-hidden="true">🗑️</div>
      <h3 id="modal-title" class="modal-title">Delete Book?</h3>
      <p id="modal-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-danger">Yes, Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
